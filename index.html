<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Economics Comprehensive Exam</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --accent: #f59e0b;
            --bg-slate: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-slate);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, var(--primary), #1e40af);
            color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        header p {
            color: #93c5fd;
            font-size: 1.1rem;
        }

        .score-board {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .score-info span {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .progress-bar {
            height: 10px;
            background: #e2e8f0;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-light);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease;
        }

        .question-card h3 {
            font-size: 1.15rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .options-list {
            list-style: none;
        }

        .option-item {
            background: #f1f5f9;
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-item:hover {
            background: #e2e8f0;
            border-color: #cbd5e1;
        }

        .option-item.selected {
            border-color: var(--primary-light);
            background: #eff6ff;
        }

        .option-item.correct {
            background: #dcfce7 !important;
            border-color: var(--success) !important;
            color: #14532d;
            font-weight: 600;
        }

        .option-item.incorrect {
            background: #fee2e2 !important;
            border-color: var(--danger) !important;
            color: #7f1d1d;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;

        }

        .btn:hover {
            background: #1d4ed8;
        }

        .explanation {
            margin-top: 15px;
            padding: 12px 15px;
            background: #fffbeb;
            border-left: 4px solid var(--accent);
            border-radius: 4px;
            font-size: 0.95rem;
            color: #78350f;
            display: none;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Business Economics Exam</h1>
            <p>Comprehensive 35-Question Interactive Test</p>
        </header>

        <div class="score-board">
            <div class="score-info">
                Status: <span id="progress-text">0 / 35 Answered</span>
            </div>
            <button class="btn" id="submit-btn" onclick="submitExam()">Submit Exam</button>
        </div>

        <div id="quiz-container"></div>

        <footer>
            <p>&copy; Business Economics Instructional Material</p>
        </footer>
    </div>

    <script src="questions.json"></script>
    <script src="app.js"></script>
</body>
</html>
